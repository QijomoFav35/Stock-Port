# Render Blueprint: one Node web service running the Next.js app (pages + API routes).
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: stock-port
    runtime: node
    plan: free # sleeps after 15 min idle (slow first load). Switch to starter ($7/mo) to stay awake
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/geo
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_BASE_BUILDER_CODE
        sync: false
      - key: NEXT_PUBLIC_BASE_RPC_URL
        sync: false
      - key: ZEROX_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      - key: GEO_SOURCE
        value: ipinfo
      - key: SWAP_PROVIDER
        value: aerodrome
